name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # فك ضغط ملف الـ ZIP تلقائياً داخل خادم جيت هب
      - name: Auto-Extract ZIP (Mobile Upload Support)
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE. Extracting..."
            unzip -o -q "$ZIP_FILE" -d extracted_app/ || true
          fi

      # تحديد مسار المشروع تلقائياً
      - name: Locate Android Project Root
        id: locate_project
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          else
            echo "project_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK with Gradle
        run: |
          cd "${{ steps.locate_project.outputs.project_dir }}"
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=YOUR_API_KEY" > .env
          fi
          gradle assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecondBrain-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/*.apk
          retention-days: 30
