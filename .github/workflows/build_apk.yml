name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # فك ضغط أي ملف ZIP مرفوع في أي مكان داخل المستودع تلقائياً
      - name: Auto-Extract ZIP (Mobile Upload Support)
        run: |
          echo "Searching for any uploaded ZIP files..."
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file at: $ZIP_FILE. Extracting..."
            unzip -o -q "$ZIP_FILE" -d . || true
          else
            echo "No zip file found, using repo files directly."
          fi

      # تحديد مسار المشروع تلقائياً
      - name: Locate Android Project Root
        id: locate_project
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            echo "Found project directory: $PROJECT_DIR"
            echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          else
            echo "project_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # قبول تراخيص الأندرويد الموجودة مسبقاً في خوادم جيت هب
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      # إنشاء مفتاح debug.keystore وملف .env تلقائياً لتوقيع الـ APK بنجاح
      - name: Prepare Keystore & Environment
        run: |
          cd "${{ steps.locate_project.outputs.project_dir }}"
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=YOUR_API_KEY" > .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      # تجميع وبناء ملف الـ APK
      - name: Build Debug APK with Gradle
        run: |
          cd "${{ steps.locate_project.outputs.project_dir }}"
          gradle assembleDebug --stacktrace --no-daemon

      # رفع ملف الـ APK النهائي إلى قسم Artifacts للتحميل
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecondBrain-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/*.apk
          retention-days: 30
